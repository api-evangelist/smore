aid: smore
name: Smore
description: >-
  Smore is a newsletter and flyer builder purpose-built for educators, schools, and districts,
  letting teachers and administrators create accessible, mobile-friendly digital newsletters from
  customizable templates to keep families and staff informed. The product emphasizes WCAG AA
  accessibility, translation for multilingual families, and engagement analytics on opens and clicks.
  Smore is now part of SchoolStatus, the family-engagement platform. It was surfaced as a Techstars
  portfolio company and added to the API Evangelist network. As of this enrichment pass Smore
  publishes no public developer program, API, developer portal, or OpenAPI surface — this profile
  captures its identity, public web properties, and probed domain security posture only.
